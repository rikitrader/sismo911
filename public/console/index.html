<!DOCTYPE html>
<html lang="es" class="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <title>Administración · SISMO911</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/console/app.css" />
  <script>
    // Apply theme before paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('sismo-admin-theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="/console/app.js" defer></script>
  <noscript>
    <div style="padding:32px;font-family:system-ui">La consola de administración requiere JavaScript.</div>
  </noscript>
</body>
</html>
