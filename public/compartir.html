<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SISMO911 — Evidencia compartida</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="theme-color" content="#0b1830" />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1830;color:#e7ecf5;min-height:100vh}
    header{background:linear-gradient(180deg,#0b1830,#13284f);padding:14px 18px;display:flex;align-items:center;gap:10px}
    header b{font-family:'Public Sans';font-weight:900;font-size:18px}
    .wrap{max-width:680px;margin:0 auto;padding:18px}
    .card{background:#0f1c34;border:1px solid #27406e;border-radius:14px;overflow:hidden}
    .card img{display:block;width:100%;background:#000}
    .body{padding:16px}
    h1{font-family:'Public Sans';font-size:20px;margin:.2rem 0}
    .muted{color:#94a3b8;font-size:13px}
    .badge{display:inline-block;background:#bb0027;color:#fff;font-weight:800;font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
    .note{margin-top:14px;font-size:12px;color:#7e8aa3;border-top:1px solid #27406e;padding-top:10px}
    .err{text-align:center;padding:60px 20px}
    a.cta{display:inline-block;margin-top:12px;background:#bb0027;color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:8px}
  </style>
</head>
<body>
  <header><img src="/logo.svg" width="26" height="26" alt=""><b>SISMO911</b><span class="muted">· Evidencia compartida</span></header>
  <div class="wrap" id="root"><p class="muted" style="text-align:center;padding:40px">Cargando…</p></div>
<script>
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const token=location.pathname.split('/').filter(Boolean).pop();
(async()=>{
  const root=document.getElementById('root');
  try{
    const r=await fetch('/api/e/'+encodeURIComponent(token));
    if(r.status===410){root.innerHTML='<div class="err"><h1>Enlace caducado o revocado</h1><p class="muted">Este enlace de evidencia ya no está disponible.</p><a class="cta" href="https://sismo911.com">Ir a SISMO911</a></div>';return;}
    if(!r.ok){root.innerHTML='<div class="err"><h1>Enlace no válido</h1><p class="muted">No encontramos esta evidencia.</p><a class="cta" href="https://sismo911.com">Ir a SISMO911</a></div>';return;}
    const j=await r.json();
    const exp=new Date(j.expires_ms).toLocaleString('es-VE',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    root.innerHTML=`<div class="card">
      <img src="${esc(j.file_url)}" alt="Evidencia">
      <div class="body">
        <span class="badge">EVIDENCIA${j.redacted?' · CENSURADA':''}</span>
        <h1>${esc(j.title||'Evidencia')}</h1>
        ${j.caption?`<p>${esc(j.caption)}</p>`:''}
        <p class="muted">Copia ${j.redacted?'censurada y ':''}con marca de agua compartida desde SISMO911. Caduca el ${esc(exp)}.</p>
        <a class="cta" href="https://sismo911.com">Reportar información en SISMO911</a>
        <div class="note">Esta es una copia segura para difusión: no expone el archivo original ni datos personales del expediente. La integridad del original se conserva bajo cadena de custodia.</div>
      </div></div>`;
  }catch(e){root.innerHTML='<div class="err"><h1>Error</h1><p class="muted">No se pudo cargar la evidencia.</p></div>';}
})();
</script>
</body>
</html>
