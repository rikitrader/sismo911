<style>body{background:#f9f9fc}</style>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebPage","name":"Canal Comunitario — SISMO911","description":"Canal comunitario de información verificada tras el terremoto en Venezuela.","url":"https://sismo911.com/canal","inLanguage":"es","isPartOf":{"@type":"WebSite","name":"SISMO911","url":"https://sismo911.com/"}}
</script>
</head>
<body class="font-sans text-on-surface">

<main class="mx-auto max-w-2xl px-4 py-6">
  <div class="flex items-center justify-between mb-3">
    <h1 class="font-display font-extrabold text-2xl">Canal comunitario</h1>
    <span class="flex items-center gap-1 text-xs text-safe font-semibold"><span class="h-2 w-2 rounded-full bg-safe animate-pulse"></span> En vivo</span>
  </div>
  <p class="text-xs text-on-surface-variant mb-4">⚠️ Solo información verificada. No compartas rumores ni ubicaciones exactas de personas. Mensajes moderados.</p>

  <div id="chat" class="bg-white border border-outline-variant/60 rounded-xl p-3 h-[55vh] overflow-y-auto space-y-2 text-sm"></div>

  <form id="f" class="mt-3 flex gap-2">
    <input id="name" placeholder="Nombre" class="w-28 border border-outline-variant rounded-lg px-3 py-2 text-sm">
    <input id="body" placeholder="Escribe información verificada…" maxlength="600" class="flex-1 border border-outline-variant rounded-lg px-3 py-2 text-sm">
    <button class="bg-primary text-white font-semibold rounded-lg px-4 text-sm">Enviar</button>
  </form>
</main>

<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
const box=document.getElementById('chat');let last=0;
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>new Date(ms).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
async function load(){try{const r=await fetch('/api/chat?since='+last);const d=await r.json();if(d.length){const atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-40;
  d.forEach(m=>{last=Math.max(last,m.created_ms);const el=document.createElement('div');const off=m.role==='official'?'border-l-2 border-secondary pl-2':'';
    el.className=off;el.innerHTML=`<span class="font-semibold text-primary">${esc(m.name||'Anónimo')}</span> <span class="text-on-surface-variant text-xs">${fmt(m.created_ms)}</span><br>${esc(m.body)}`;box.appendChild(el);});
  if(atBottom)box.scrollTop=box.scrollHeight;}}catch{}}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const bi=document.getElementById('body'),ni=document.getElementById('name');const body=bi.value.trim();if(!body)return;
  bi.value='';try{await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:ni.value||'Anónimo',body})});if(ni.value)localStorage.setItem('s911name',ni.value);await load();box.scrollTop=box.scrollHeight;}catch{bi.value=body;}};
document.getElementById('name').value=localStorage.getItem('s911name')||'';
load();setInterval(load,5000);
</script>
</body>
</html>
