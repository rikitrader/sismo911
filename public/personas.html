<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:type" content="website"><meta property="og:site_name" content="SISMO911"><meta property="og:locale" content="es_VE">
<meta property="og:title" content="Personas desaparecidas — buscar y reportar | SISMO911">
<meta property="og:description" content="Busca por nombre o teléfono, reporta a un desaparecido y marca cuando alguien aparece tras el terremoto en Venezuela.">
<meta property="og:url" content="https://sismo911.com/personas">
<meta property="og:image" content="https://sismo911.com/og/og-default.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Personas desaparecidas — SISMO911"><meta name="twitter:description" content="Busca y reporta personas desaparecidas tras el terremoto en Venezuela."><meta name="twitter:image" content="https://sismo911.com/og/og-default.png">

<style>body{background:#f9f9fc}.font-display{font-family:'Public Sans',sans-serif}input,select,textarea{width:100%;border:1px solid #c4c6d0;border-radius:.5rem;padding:.55rem .7rem;font-size:.9rem;background:#fff}</style>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebPage","name":"Personas desaparecidas — SISMO911","description":"Registro comunitario de personas desaparecidas tras el terremoto en Venezuela.","url":"https://sismo911.com/personas","inLanguage":"es","isPartOf":{"@type":"WebSite","name":"SISMO911","url":"https://sismo911.com/"}}
</script>
</head>
<body class="font-sans text-on-surface">
<header class="bg-primary text-white sticky top-0 z-50"><div class="mx-auto max-w-6xl px-4 h-14 flex items-center gap-3"><a href="/" class="flex items-center gap-2 shrink-0"><img src="/logo.svg" class="h-8 w-8" alt="SISMO911"><b class="font-display tracking-tight">SISMO911</b></a><nav class="ml-auto flex flex-wrap items-center gap-x-3 gap-y-1 text-[13px] font-medium"><a href="/mapa" class="hover:text-white/70">Mapa</a><a href="/reportar" class="hover:text-white/70">Reportar</a><a href="/sos" class="text-secondary-fixed font-bold">SOS</a><a href="/personas" class="text-white">Personas</a><a href="/familia" class="hover:text-white/70">Familia</a><a href="/canal" class="hover:text-white/70">Canal</a><a href="/movimiento" class="hover:text-white/70">Movimiento</a></nav></div></header>

<main class="mx-auto max-w-3xl px-4 py-8">
  <h1 class="font-display font-extrabold text-3xl mb-1">Personas desaparecidas</h1>
  <p class="text-on-surface-variant text-sm mb-5">Busca, reporta y ayuda a reunir familias. Los reportes pasan por revisión. <b>No publiques datos sensibles de menores sin consentimiento.</b></p>

  <div class="grid sm:grid-cols-3 gap-3 mb-6">
    <div class="bg-white border border-outline-variant/60 rounded-xl p-4 text-center"><div id="s_missing" class="font-display font-extrabold text-3xl text-warning">—</div><div class="text-xs text-on-surface-variant">Buscadas</div></div>
    <div class="bg-white border border-outline-variant/60 rounded-xl p-4 text-center"><div id="s_found" class="font-display font-extrabold text-3xl text-safe">—</div><div class="text-xs text-on-surface-variant">Reencontradas</div></div>
    <div class="bg-white border border-outline-variant/60 rounded-xl p-4 text-center"><div id="s_total" class="font-display font-extrabold text-3xl text-primary">—</div><div class="text-xs text-on-surface-variant">Total registradas</div></div>
  </div>

  <!-- Search -->
  <div class="bg-white border border-outline-variant/60 rounded-xl p-4 mb-6">
    <label class="text-sm font-semibold text-on-surface-variant">Buscar persona</label>
    <input id="q" placeholder="Nombre o teléfono…" class="mt-1">
    <div id="results" class="mt-3 space-y-2"></div>
  </div>

  <!-- Report -->
  <details class="bg-white border border-outline-variant/60 rounded-xl p-4">
    <summary class="font-display font-bold text-primary cursor-pointer">＋ Reportar a un desaparecido</summary>
    <form id="f" class="mt-4 grid sm:grid-cols-2 gap-3">
      <input id="full_name" placeholder="Nombre completo *" class="sm:col-span-2">
      <input id="age" type="number" placeholder="Edad">
      <select id="sex"><option value="">Sexo</option><option value="F">Femenino</option><option value="M">Masculino</option><option value="O">Otro</option></select>
      <input id="last_seen" placeholder="Visto por última vez (lugar)" class="sm:col-span-2">
      <input id="contact_phone" placeholder="Teléfono de contacto" class="sm:col-span-2">
      <textarea id="notes" rows="2" placeholder="Detalles (ropa, señas, circunstancias)" class="sm:col-span-2"></textarea>
      <button class="bg-secondary text-white font-bold rounded-lg py-2.5 sm:col-span-2">Enviar reporte</button>
      <p id="msg" class="text-sm text-center sm:col-span-2"></p>
    </form>
  </details>
</main>

<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={missing:['Buscada','bg-warning'],found_safe:['A salvo','bg-safe'],found_deceased:['Fallecida','bg-on-surface-variant'],unknown:['Sin datos','bg-outline-variant']};
async function stats(){try{const d=await fetch('/api/persons/stats').then(r=>r.json());document.getElementById('s_missing').textContent=d.missing;document.getElementById('s_found').textContent=d.found;document.getElementById('s_total').textContent=d.total;}catch{}}
let t;const qi=document.getElementById('q');qi.oninput=()=>{clearTimeout(t);t=setTimeout(search,300);};
async function search(){const q=qi.value.trim();const box=document.getElementById('results');if(q.length<2){box.innerHTML='';return;}
  const{persons=[]}=await fetch('/api/persons/search?q='+encodeURIComponent(q)).then(r=>r.json());
  box.innerHTML=persons.length?persons.map(p=>{const[l,cl]=ST[p.status]||ST.unknown;return `<div class="border border-outline-variant/60 rounded-lg px-3 py-2 flex items-center justify-between">
    <div><div class="font-semibold text-sm">${esc(p.full_name)}${p.age?`, ${Number(p.age)}`:''}</div><div class="text-xs text-on-surface-variant">${esc(p.last_seen||'')}</div></div>
    <div class="flex items-center gap-2"><span class="${cl} text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${l}</span></div></div>`;}).join(''):'<p class="text-sm text-on-surface-variant">Sin coincidencias.</p>';}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');const name=document.getElementById('full_name').value.trim();
  if(!name){msg.style.color='#bb0027';msg.textContent='El nombre es obligatorio.';return;}
  const body={full_name:name,age:document.getElementById('age').value||null,sex:document.getElementById('sex').value||null,last_seen:document.getElementById('last_seen').value,contact_phone:document.getElementById('contact_phone').value,notes:document.getElementById('notes').value};
  const r=await fetch('/api/persons',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();
  if(r.ok){msg.style.color='#2e7d32';msg.textContent='✓ '+(d.message||'Reporte recibido.');e.target.reset();}else{msg.style.color='#bb0027';msg.textContent=d.error||'Error.';}};
stats();
</script>
</body>
</html>
