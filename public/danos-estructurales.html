<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daños Estructurales — SISMO911</title>
<meta name="description" content="Mapa en vivo de daños estructurales del terremoto en Venezuela: edificios colapsados, dañados, fugas de gas y personas atrapadas. Fuente comunitaria SOS Venezuela 2026.">
<link rel="canonical" href="https://sismo911.com/danos-estructurales">
<meta property="og:type" content="website"><meta property="og:site_name" content="SISMO911"><meta property="og:locale" content="es_VE">
<meta property="og:title" content="Daños Estructurales — Mapa en vivo | SISMO911">
<meta property="og:description" content="Edificios colapsados y dañados, fugas de gas y personas atrapadas tras el terremoto en Venezuela.">
<meta property="og:url" content="https://sismo911.com/danos-estructurales"><meta property="og:image" content="https://sismo911.com/og/og-default.png">
<link rel="icon" type="image/svg+xml" href="/logo.svg"><meta name="theme-color" content="#13284f">
<link rel="manifest" href="/manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/app.css" />
<style>
.font-display{font-family:'Public Sans',sans-serif}body{margin:0;font-family:Inter,sans-serif;background:#f9f9fc}
#map{position:absolute;top:0;bottom:0;left:0;right:0}
.dmk{border-radius:9999px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dmk.pulse::after{content:'';position:absolute;inset:-3px;border-radius:9999px;box-shadow:0 0 0 0 rgba(200,16,46,.6);animation:dp 1.6s infinite}
@keyframes dp{70%{box-shadow:0 0 0 14px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.leaflet-container{font-family:Inter,sans-serif}
</style>
<script src="/app-shell.js" defer></script>
</head>
<body class="text-on-surface">
<header class="bg-primary text-white"><div class="mx-auto max-w-6xl px-4 h-14 flex items-center gap-2"><img src="/logo.svg" class="h-8 w-8"><b class="font-display">SISMO911</b></div></header>

<div class="relative" style="height:calc(100vh - 56px)">
  <div id="map"></div>

  <!-- Filter / summary panel -->
  <div class="absolute top-4 left-4 z-[500] bg-white rounded-xl shadow-lg border border-outline-variant/60 w-72 max-h-[calc(100%-2rem)] overflow-y-auto">
    <div class="px-4 py-3 border-b border-outline-variant/50">
      <div class="font-display font-extrabold text-lg">Daños Estructurales</div>
      <div class="text-[11px] text-on-surface-variant">Fuente: <a href="https://sosvenezuela2026.com" target="_blank" class="underline">SOS Venezuela 2026</a> · mapa comunitario</div>
      <div class="flex gap-1 mt-2 bg-surface-container rounded-lg p-0.5 text-xs font-display font-semibold">
        <button id="viewMapa" class="flex-1 py-1.5 rounded-md bg-white shadow text-primary">Mapa</button>
        <button id="viewLista" class="flex-1 py-1.5 rounded-md text-on-surface-variant">Lista</button>
      </div>
    </div>
    <div id="filters" class="p-2 space-y-1"></div>
    <div class="px-4 py-2 text-[11px] text-on-surface-variant border-t border-outline-variant/50">⚠️ Coordenadas aproximadas (protección anti-saqueo). Verificación comunitaria — no oficial salvo indicado.</div>
  </div>

  <div id="loading" class="absolute inset-0 grid place-items-center z-[400] pointer-events-none"><div class="bg-white/90 rounded-lg px-4 py-2 text-sm">Cargando daños…</div></div>

  <div id="listView" class="hidden absolute inset-0 z-[450] bg-surface overflow-y-auto p-4 lg:pl-[21rem]">
    <div class="max-w-5xl mb-3"><input id="listSearch" placeholder="Buscar por título, municipio o descripción…" class="w-full border border-outline-variant rounded-lg px-3 py-2.5 text-sm"></div>
    <div id="listCount" class="text-xs text-on-surface-variant mb-3 max-w-5xl"></div>
    <div id="listGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 max-w-5xl"></div>
    <div id="listMore" class="max-w-5xl flex justify-center mt-4"></div>
  </div>
</div>

<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
const CAT={
  collapsed_building:['Edificio colapsado','#c8102e'],
  damaged_building:['Edificio dañado','#e57200'],
  trapped_people:['Personas atrapadas','#c8102e'],
  gas_leak:['Fuga de gas','#e57200'],
  aid_point:['Punto de ayuda','#0b2b5b'],
  shelter:['Refugio','#0b2b5b'],
  water_point:['Punto de agua','#2563eb'],
  medical_need:['Necesidad médica','#bb0027'],
};
const SEVCOL={rojo:'#c8102e',naranja:'#e57200',amarillo:'#ffbc3d'};
const VERIF={community_confirmed:'Confirmado por comunidad',official_verified:'Verificado oficial',unverified:'Sin verificar'};
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{u=(u||'').trim();return /^https?:\/\//i.test(u)?u:'#';};
const color=r=>{ if(['aid_point','shelter','water_point','medical_need'].includes(r.category))return CAT[r.category]?.[1]||'#0b2b5b'; return SEVCOL[r.severity]||CAT[r.category]?.[1]||'#e57200'; };

const map=L.map('map',{attributionControl:false}).setView([10.3,-66.9],8);
L.control.attribution({prefix:false}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OSM, © CARTO · SOS Venezuela 2026',maxZoom:19}).addTo(map);
const layers={}; let active=new Set(Object.keys(CAT));

function render(reports){
  Object.values(layers).forEach(l=>l.clearLayers());
  reports.forEach(r=>{
    if(!r.lat||!r.lng)return;
    const cat=r.category||'damaged_building';
    if(!layers[cat])layers[cat]=L.layerGroup().addTo(map);
    const trap=cat==='trapped_people';
    const size= cat==='collapsed_building'||trap?16:12;
    const ic=L.divIcon({className:'',html:`<div class="dmk ${trap?'pulse':''}" style="position:relative;width:${size}px;height:${size}px;background:${color(r)}"></div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});
    L.marker([r.lat,r.lng],{icon:ic}).addTo(layers[cat]).bindPopup(
      `<div style="min-width:180px"><div style="font-weight:700;color:${color(r)}">${esc(CAT[cat]?.[0]||cat)}</div>
       <div style="font-weight:600;margin:2px 0">${esc(r.title||'')}</div>
       <div style="font-size:12px;color:#44474f">${esc(r.description||'')}</div>
       <div style="font-size:11px;color:#747780;margin-top:4px">${esc(r.municipio||'')}${r.parroquia?' · '+esc(r.parroquia):''} · ${VERIF[r.verification]||''}</div>
       ${r.source_url?`<a href="${esc(safeUrl(r.source_url))}" target="_blank" rel="noopener" style="font-size:11px;color:#0b2b5b">fuente ↗</a>`:''}</div>`);
  });
  Object.keys(layers).forEach(c=>active.has(c)?layers[c].addTo(map):map.removeLayer(layers[c]));
}

function buildFilters(counts){
  const byCat=Object.fromEntries(counts.map(c=>[c.category,c.n]));
  document.getElementById('filters').innerHTML=Object.entries(CAT).map(([k,[label,col]])=>{
    const n=byCat[k]||0;
    return `<label class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-surface-container cursor-pointer text-sm">
      <input type="checkbox" data-cat="${k}" checked class="catbox">
      <span style="width:11px;height:11px;border-radius:9999px;background:${col};display:inline-block;flex:0 0 auto"></span>
      <span class="flex-1">${label}</span><span class="text-xs text-on-surface-variant font-mono">${n}</span></label>`;
  }).join('');
  document.querySelectorAll('.catbox').forEach(b=>b.onchange=()=>{const c=b.dataset.cat; b.checked?active.add(c):active.delete(c); Object.keys(layers).forEach(k=>active.has(k)?layers[k].addTo(map):map.removeLayer(layers[k])); renderList();});
}

// ---- List view (search + pagination) ----
let ALL=[]; let listShown=30;
function renderList(){
  const term=(document.getElementById('listSearch').value||'').trim().toLowerCase();
  const rows=ALL.filter(r=>active.has(r.category||'damaged_building'))
    .filter(r=>!term || `${r.title||''} ${r.municipio||''} ${r.parroquia||''} ${r.description||''}`.toLowerCase().includes(term));
  const page=rows.slice(0,listShown);
  document.getElementById('listCount').textContent=`${rows.length.toLocaleString('es')} reporte(s)${term?' (filtrado)':''} · mostrando ${page.length}`;
  document.getElementById('listGrid').innerHTML=page.map(r=>`
    <div class="bg-white border border-outline-variant/60 rounded-lg p-3">
      <div class="flex items-center gap-2"><span style="width:10px;height:10px;border-radius:9999px;background:${color(r)};display:inline-block"></span>
      <span class="text-xs font-bold" style="color:${color(r)}">${esc(CAT[r.category]?.[0]||r.category)}</span></div>
      <div class="font-display font-bold mt-1 leading-snug">${esc(r.title||'(sin título)')}</div>
      <div class="text-xs text-on-surface-variant mt-0.5">${esc(r.description||'')}</div>
      <div class="text-[11px] text-on-surface-variant mt-1">${esc(r.municipio||'—')}${r.parroquia?' · '+esc(r.parroquia):''} · ${VERIF[r.verification]||''}</div>
      ${r.source_url?`<a href="${esc(safeUrl(r.source_url))}" target="_blank" rel="noopener" class="text-[11px] text-primary underline">fuente ↗</a>`:''}
    </div>`).join('') || '<p class="text-on-surface-variant text-sm col-span-full">Sin reportes.</p>';
  document.getElementById('listMore').innerHTML = rows.length>listShown
    ? '<button id="listMoreBtn" class="px-4 py-2 rounded-lg border border-outline-variant text-sm font-display font-semibold hover:bg-surface-container">Cargar más</button>' : '';
  const mb=document.getElementById('listMoreBtn'); if(mb)mb.onclick=()=>{listShown+=30;renderList();};
}
let lst;document.getElementById('listSearch').addEventListener('input',()=>{clearTimeout(lst);lst=setTimeout(()=>{listShown=30;renderList();},250);});
const vMapa=document.getElementById('viewMapa'),vLista=document.getElementById('viewLista'),listView=document.getElementById('listView');
function setView(list){ listView.classList.toggle('hidden',!list);
  vLista.classList.toggle('bg-white',list);vLista.classList.toggle('shadow',list);vLista.classList.toggle('text-primary',list);vLista.classList.toggle('text-on-surface-variant',!list);
  vMapa.classList.toggle('bg-white',!list);vMapa.classList.toggle('shadow',!list);vMapa.classList.toggle('text-primary',!list);vMapa.classList.toggle('text-on-surface-variant',list);
  if(list)renderList(); else map.invalidateSize();}
vMapa.onclick=()=>setView(false); vLista.onclick=()=>setView(true);

fetch('/api/danos-estructurales').then(r=>r.json()).then(d=>{
  document.getElementById('loading').style.display='none';
  ALL=d.reports||[];
  buildFilters(d.counts||[]);
  render(ALL);
  renderList();
  if(ALL.length){const g=L.featureGroup(Object.values(layers)); try{map.fitBounds(g.getBounds().pad(0.2));}catch{}}
}).catch(()=>{document.getElementById('loading').innerHTML='<div class="bg-white rounded-lg px-4 py-2 text-sm text-secondary">No se pudieron cargar los daños.</div>';});
</script>

<!-- ===== Monitor Social en vivo (self-contained, no toca el mapa) ===== -->
<style>
#msLauncher{position:fixed;right:14px;bottom:16px;z-index:500;background:#13284f;color:#fff;border-radius:999px;padding:.6rem .9rem;font-family:'Public Sans',sans-serif;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;gap:.4rem}
#msLauncher .badge{background:#c70d2e;border-radius:999px;font-size:11px;padding:.05rem .4rem;min-width:18px;text-align:center}
#msPanel{position:fixed;top:0;right:0;height:100%;width:min(390px,92vw);z-index:501;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
#msPanel.open{transform:translateX(0)}
#msPanel header{background:#13284f;color:#fff;padding:.8rem 1rem;display:flex;align-items:center;gap:.5rem}
#msFilters{display:flex;gap:.3rem;flex-wrap:wrap;padding:.6rem 1rem;border-bottom:1px solid #eef0f4}
.msChip{font-size:12px;border:1px solid #d8dbe2;border-radius:999px;padding:.15rem .6rem;cursor:pointer;font-weight:600}
.msChip.on{background:#13284f;color:#fff;border-color:#13284f}
#msList{flex:1;overflow-y:auto;padding:.5rem .75rem}
.msItem{border-bottom:1px solid #f0f1f5;padding:.55rem .25rem;font-size:13px}
.msDot{width:8px;height:8px;border-radius:999px;display:inline-block;margin-right:.35rem;vertical-align:middle}
</style>
<div id="msLauncher">📡 Monitor Social <span class="badge" id="msCount">·</span></div>
<aside id="msPanel" aria-hidden="true">
  <header><b class="font-display flex-1">Monitor Social — en vivo</b><button id="msClose" class="text-white/90 text-lg leading-none">✕</button></header>
  <div id="msFilters">
    <span class="msChip on" data-sev="">Todo</span>
    <span class="msChip" data-sev="critical">🔴 Crítico</span>
    <span class="msChip" data-sev="alert">🟠 Alerta</span>
    <span class="msChip" data-sev="info">🟡 Info</span>
  </div>
  <div id="msMeta" class="text-[11px] text-on-surface-variant px-4 py-1.5"></div>
  <div id="msList"><div class="p-4 text-sm text-on-surface-variant">Cargando señales…</div></div>
</aside>
<script>
(function(){
  const SEVC={critical:'#c70d2e',alert:'#d97706',info:'#475569'};
  const PIC={tiktok:'🎵',instagram:'📸',reddit:'👽',gdelt:'📰',telegram:'✈️',x:'✖️'};
  const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{u=(u||'').trim();return /^https?:\/\//i.test(u)?u:'#';};
  const ago=t=>{if(!t)return '';const s=(Date.now()-t)/1000;if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';return Math.floor(s/86400)+' d';};
  const P=document.getElementById('msPanel');
  let sev='';
  document.getElementById('msLauncher').onclick=()=>{P.classList.add('open');load();};
  document.getElementById('msClose').onclick=()=>P.classList.remove('open');
  document.querySelectorAll('.msChip').forEach(ch=>ch.onclick=()=>{document.querySelectorAll('.msChip').forEach(x=>x.classList.remove('on'));ch.classList.add('on');sev=ch.dataset.sev;load();});
  function load(){
    const qs=sev?('?severity='+sev+'&limit=120'):'?limit=120';
    fetch('/api/monitor/signals'+qs).then(r=>r.json()).then(d=>{
      const sig=d.signals||[];
      document.getElementById('msList').innerHTML=sig.length?sig.map(s=>`
        <div class="msItem">
          <div><span class="msDot" style="background:${SEVC[s.severity]||'#475569'}"></span>
            <span title="${esc(s.platform)}">${PIC[s.platform]||'•'}</span>
            ${s.city?`<b class="font-display"> ${esc(s.city)}</b> · `:' '}
            <span class="text-on-surface-variant text-[11px]">${ago(s.posted_ms)}</span></div>
          <div class="mt-0.5">${esc((s.title||s.text||'').slice(0,180))}</div>
          <div class="mt-0.5 text-[11px] text-on-surface-variant">${esc(s.tags||'')}${s.url?` · <a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener" class="text-primary underline">ver</a>`:''}</div>
        </div>`).join(''):'<div class="p-4 text-sm text-on-surface-variant">Sin señales todavía. El monitor actualiza cada hora.</div>';
    }).catch(()=>{document.getElementById('msList').innerHTML='<div class="p-4 text-sm text-secondary">No se pudo cargar el monitor.</div>';});
  }
  fetch('/api/monitor/stats').then(r=>r.json()).then(d=>{
    document.getElementById('msCount').textContent=d.total||0;
    const crit=(d.by_severity||[]).find(x=>x.severity==='critical');
    document.getElementById('msMeta').textContent=`${d.total||0} señales · ${crit?crit.n:0} críticas · últ. ${d.last_ingest_ms?ago(d.last_ingest_ms)+' atrás':'—'}`;
  }).catch(()=>{});
})();
</script>
</body>
</html>
