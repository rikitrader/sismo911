<body>
<header class="bg-primary text-white sticky top-0 z-[1000]" style="height:56px"><div class="mx-auto max-w-6xl px-4 h-14 flex items-center gap-3"><a href="/" class="flex items-center gap-2 shrink-0"><img src="/logo.svg" class="h-8 w-8" alt="SISMO911"><b class="font-display tracking-tight">SISMO911</b></a><nav class="ml-auto flex flex-wrap items-center gap-x-3 gap-y-1 text-[13px] font-medium"><a href="/" class="hover:text-white/70">Panel</a><a href="/mapa" class="text-white">Mapa</a><a href="/alertas" class="hover:text-white/70">Alertas</a><a href="/sos" class="text-secondary-fixed font-bold">SOS</a><a href="/familia" class="hover:text-white/70">Familia</a><a href="/recursos" class="hover:text-white/70">Recursos</a><a href="/comms" class="hover:text-white/70">Radio</a><a href="/guia" class="hover:text-white/70">Guía</a><a href="/reportar" class="hover:text-white/70">Reportar</a><a href="/canal" class="hover:text-white/70">Canal</a><a href="/movimiento" class="hover:text-white/70">Movimiento</a><a href="/blog" class="hover:text-white/70">Blog</a></nav></div></header>
<div id="map"></div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
const map=L.map('map',{attributionControl:false}).setView([8.5,-66.5],6);
L.control.attribution({prefix:false}).addTo(map);
const street=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OSM, © CARTO · USGS',maxZoom:19}).addTo(map);
const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri',maxZoom:19});
const gibs=L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/2026-06-24/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg',{attribution:'NASA GIBS',maxZoom:9});
const sismos=L.layerGroup().addTo(map),heat=L.layerGroup(),refugios=L.layerGroup(),reportes=L.layerGroup().addTo(map);
L.control.layers({'Calle':street,'Satélite (Esri)':esri,'Satélite (NASA GIBS)':gibs},{'Sismos':sismos,'Reportes ciudadanos':reportes,'Mapa de riesgo':heat,'Refugios/Hospitales':refugios}).addTo(map);
// Citizen damage reports (approved) — colored by severity, labeled by category.
const SEVHEX={rojo:'#bb0027',naranja:'#e57200',amarillo:'#f2c200'};
const CATICON={collapsed_building:'🏚️',damaged_building:'🧱',trapped_people:'🆘',gas_leak:'⛽',medical_need:'➕',aid_point:'🤝',water_point:'💧',shelter:'⛺',other:'📌'};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('/api/reports?limit=800').then(r=>r.json()).then(rows=>{(rows||[]).forEach(x=>{if(x.lat==null||x.lon==null)return;const col=SEVHEX[x.severity]||'#445e91';
  L.marker([x.lat,x.lon],{icon:L.divIcon({className:'',html:`<div style="font-size:15px;line-height:22px;width:24px;height:24px;text-align:center;border-radius:9999px;background:${col};box-shadow:0 0 0 2px #fff">${CATICON[x.category]||'📌'}</div>`,iconSize:[24,24],iconAnchor:[12,12]})})
   .bindPopup(`<b>${esc(x.title||x.category)}</b><br>${esc(x.description||'')}<br><span style="color:#666;font-size:11px">${x.source==='kobotoolbox'?'Fuente: KoboToolbox':'Reporte ciudadano'} · ${x.verification}</span>`).addTo(reportes);});});
const HEX=m=>m>=4?'#c8102e':m>=2.5?'#e57200':'#2e7d32';
fetch('/api/events?limit=300').then(r=>r.json()).then(d=>{(d.events||[]).forEach((e,i)=>{const s=Math.max(9,Math.min(34,8+(e.mag-1.5)*6));const rec=i===0;
  L.marker([e.lat,e.lon],{icon:L.divIcon({className:'',html:`<div class="${rec?'qp':''}" style="position:relative;width:${s}px;height:${s}px;border-radius:9999px;background:${HEX(e.mag)};box-shadow:0 0 0 2px #fff"></div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]})}).bindPopup(`<b>M ${e.mag}</b> · ${e.place}<br>prof ${e.depth_km} km`).addTo(sismos);});});
fetch('/api/heatmap').then(r=>r.json()).then(d=>{(d.points||[]).forEach(([la,lo,w])=>L.circle([la,lo],{radius:12000+w*60000,stroke:false,fillColor:'#c8102e',fillOpacity:.08+w*.18}).addTo(heat));});
fetch('/api/facilities?lat=10.3&lon=-67.0&radius=45000').then(r=>r.json()).then(d=>{(d.facilities||[]).forEach(f=>L.circleMarker([f.lat,f.lon],{radius:4,color:'#0b2b5b',weight:1,fillColor:f.type==='hospital'?'#2e7d32':'#445e91',fillOpacity:1}).bindTooltip(`${f.name} · ${f.type}`).addTo(refugios));});
</script>
