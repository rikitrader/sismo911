<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil de Emergencia — SISMO911</title>
<meta name="description" content="Perfil de emergencia — una persona que necesita ayuda urgente. Conoce su historia, comparte y moviliza apoyo.">
<meta property="og:title" content="Ayuda Urgente — SISMO911">
<meta property="og:description" content="Una persona necesita ayuda urgente. Conoce su historia y comparte.">
<meta property="og:url" content="https://sismo911.com/emergencia">
<meta property="og:image" content="https://sismo911.com/og/og-default.png">
<meta property="og:type" content="article">
<link rel="icon" type="image/svg+xml" href="/logo.svg"><meta name="theme-color" content="#00173a">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css" />
<style>
  :root{--bg:#eef1f7;--panel:#fff;--ink:#0b1b3a;--navy:#00173a;--red:#bb0027;--gold:#c9a227;--amber:#e57200;--green:#1f8a4c;--blue:#1f5fd0;
    --muted:#5b6781;--line:#e2e6ef;--line-2:#d3d9e6;--shadow:0 1px 2px rgba(16,24,40,.06);--shadow-lg:0 10px 40px rgba(0,23,58,.18)}
  body{background:var(--bg)}
  .wrap{max-width:920px;margin:0 auto;padding:18px 16px 70px}
  .back{display:inline-flex;align-items:center;gap:6px;font:700 13px Inter;color:var(--muted);text-decoration:none;margin-bottom:14px}
  .hero{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg);min-height:300px;background:#0a1a36;display:flex;align-items:flex-end}
  .hero .bg{position:absolute;inset:0;background-size:cover;background-position:center}
  .hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,17,46,.1),rgba(0,17,46,.55) 50%,rgba(0,17,46,.95))}
  .hero .body{position:relative;z-index:2;padding:30px 32px;color:#fff;width:100%}
  .badge{display:inline-flex;align-items:center;gap:7px;background:var(--red);color:#fff;font:800 11px 'Public Sans';letter-spacing:.08em;text-transform:uppercase;padding:6px 13px;border-radius:999px;box-shadow:0 2px 10px rgba(187,0,39,.5)}
  .badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  .hero h1{font:900 40px/1.02 'Public Sans';letter-spacing:-.02em;margin:14px 0 4px;text-shadow:0 2px 18px rgba(0,0,0,.5)}
  @media(max-width:640px){.hero h1{font-size:28px}.hero .body{padding:22px}}
  .hero .meta{font:700 15px Inter;color:#d7e2f7}
  .stats{display:flex;gap:18px;margin-top:14px;font:700 12px Inter;color:#bcd0f2}
  .layout{display:grid;grid-template-columns:1fr 312px;gap:22px;margin-top:22px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px}
  .panel h2{font:800 15px 'Public Sans';color:var(--ink);letter-spacing:.01em;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .bio{font:400 15.5px/1.7 Inter;color:#26314a;white-space:pre-wrap}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line-2);cursor:zoom-in;background:#0a1a36}
  .vid{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
  .vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
  /* sticky action rail */
  .rail{position:sticky;top:16px;align-self:start}
  .praise{font:900 26px 'Public Sans';color:var(--ink);font-variant-numeric:tabular-nums}
  .praise small{font:700 13px Inter;color:var(--muted)}
  .pbar{height:10px;border-radius:999px;background:#e7ebf3;overflow:hidden;margin:12px 0 6px}
  .pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#41b772)}
  .pmeta{font:700 12.5px Inter;color:var(--muted);margin-bottom:16px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;border-radius:12px;font:800 15px 'Public Sans';padding:15px 18px;text-decoration:none;width:100%;transition:transform .12s}
  .btn:active{transform:translateY(1px)}
  .btn-gold{background:var(--gold);color:#1a1500;box-shadow:0 4px 16px rgba(201,162,39,.4)}
  .btn-red{background:var(--red);color:#fff;box-shadow:0 4px 16px rgba(187,0,39,.4)}
  .share-h{font:800 11px 'Public Sans';letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;text-align:center}
  .shares{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sh{display:grid;place-items:center;gap:4px;padding:11px 4px;border-radius:11px;border:1px solid var(--line-2);background:#fff;cursor:pointer;font:700 9.5px Inter;color:var(--muted);text-decoration:none}
  .sh:hover{background:#f3f6fb}
  .sh svg{width:21px;height:21px}
  .sh.wa{color:#1aa752}.sh.x{color:#0b1b3a}.sh.fb{color:#1877f2}.sh.tg{color:#2aabee}
  .contact{font:600 13.5px Inter;color:#26314a;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .lb{position:fixed;inset:0;background:rgba(4,10,24,.92);display:none;place-items:center;z-index:80;padding:24px}
  .lb.on{display:grid}.lb img{max-width:96vw;max-height:90vh;border-radius:10px}
  .lb .x{position:absolute;top:18px;right:22px;color:#fff;font-size:30px;cursor:pointer;background:none;border:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font:700 13px Inter;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:90}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .skel{height:300px;border-radius:18px;background:linear-gradient(100deg,#e9edf5 30%,#f3f6fb 50%,#e9edf5 70%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .nf{background:#fff;border:1px dashed var(--line-2);border-radius:16px;padding:60px 24px;text-align:center;color:var(--muted)}
  .nf b{display:block;font:800 20px 'Public Sans';color:var(--ink);margin-bottom:8px}
</style>
<script src="/app-shell.js" defer></script>
</head>
<body class="font-sans">
<main class="wrap">
  <a class="back" href="/emergencia">‹ Todas las emergencias</a>
  <div id="app"><div class="skel"></div></div>
</main>
<div class="lb" id="lb"><button class="x" data-act="closeLb">×</button><img id="lbimg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const NEED={medico:'Médico',rescate:'Rescate',desplazado:'Desplazado',duelo:'Duelo',reconstruccion:'Reconstrucción',otro:'Ayuda urgente'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMoney=(n,c)=>n==null?'':new Intl.NumberFormat('es-VE',{style:'currency',currency:(c||'USD'),maximumFractionDigits:0}).format(n);
const slug=decodeURIComponent((location.pathname.split('/')[2]||'').replace(/\.html$/,''));
let P=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function openLb(src){$('lbimg').src=src;$('lb').classList.add('on');}
function closeLb(){$('lb').classList.remove('on');}

function videoEmbed(u){
  if(!u)return'';
  let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  if(m)return`<div class="vid"><iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe></div>`;
  m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m)return`<div class="vid"><iframe src="https://player.vimeo.com/video/${m[1]}" allowfullscreen></iframe></div>`;
  if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return`<div class="vid"><video src="${esc(u)}" controls playsinline></video></div>`;
  return`<a class="btn btn-navy" style="background:var(--navy);color:#fff" href="${esc(u)}" target="_blank" rel="noopener">▶ Ver video</a>`;
}

function shareTo(net){
  if(!P)return;
  const url=encodeURIComponent(location.origin+'/emergencia/'+P.slug);
  const t=encodeURIComponent(`🆘 ${P.name} necesita ayuda urgente — SISMO911`);
  const links={
    whatsapp:`https://wa.me/?text=${t}%20${url}`,
    x:`https://twitter.com/intent/tweet?text=${t}&url=${url}`,
    facebook:`https://www.facebook.com/sharer/sharer.php?u=${url}`,
    telegram:`https://t.me/share/url?url=${url}&text=${t}`,
  };
  if(net==='copy'){navigator.clipboard.writeText(location.origin+'/emergencia/'+P.slug).then(()=>toast('Enlace copiado ✓'));}
  else if(net==='native'&&navigator.share){navigator.share({title:`${P.name} — SISMO911`,text:P.headline||'',url:location.origin+'/emergencia/'+P.slug}).catch(()=>{});}
  else window.open(links[net],'_blank','noopener,width=600,height=540');
  fetch('/api/emergencia/'+P.slug+'/share',{method:'POST'}).catch(()=>{});
}

function render(p){
  P=p;
  const pc=(p.goal_amount&&p.goal_amount>0)?Math.min(100,Math.round((p.raised_amount||0)/p.goal_amount*100)):null;
  const bg=p.hero?`background-image:url('${esc(p.hero)}')`:'background:linear-gradient(135deg,#0a1a36,#13284f)';
  const galleryImgs=(p.gallery||[]).filter(g=>g.src);
  const ICON={
    whatsapp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.516 5.26l-.999 3.648 3.972-1.215zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
    facebook:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>',
    telegram:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>',
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>'
  };
  $('app').innerHTML=`
  <section class="hero">
    <div class="bg" style="${bg}"></div>
    <div class="body">
      <span class="badge">${esc(NEED[p.need_type]||'Ayuda urgente')}${p.status==='resolved'?' · Resuelto':''}</span>
      <h1>${esc(p.name)}${p.age?`, ${p.age} años`:''}</h1>
      <div class="meta">${esc(p.location||'Venezuela')}</div>
      <div class="stats"><span>👁 ${new Intl.NumberFormat('es-VE').format(p.views||0)} vistas</span><span>↗ ${new Intl.NumberFormat('es-VE').format(p.shares||0)} compartidos</span></div>
    </div>
  </section>
  <div class="layout">
    <div>
      ${p.headline?`<div class="panel" style="border-left:4px solid var(--gold)"><div style="font:700 17px/1.5 Inter;color:#1a233b">${esc(p.headline)}</div></div><div style="height:18px"></div>`:''}
      <div class="panel"><h2>🩹 Su historia</h2><div class="bio">${esc(p.bio||'Sin descripción todavía.')}</div></div>
      ${p.video_url?`<div style="height:18px"></div><div class="panel"><h2>🎬 Video</h2>${videoEmbed(p.video_url)}</div>`:''}
      ${galleryImgs.length?`<div style="height:18px"></div><div class="panel"><h2>📷 Fotos</h2><div class="gallery">${galleryImgs.map(g=>`<img loading="lazy" src="${esc(g.src)}" alt="${esc(g.caption||p.name)}" data-act="openLb" data-a1="${esc(g.src)}">`).join('')}</div></div>`:''}
    </div>
    <aside class="rail">
      <div class="panel">
        ${pc!=null?`<div class="praise">${fmtMoney(p.raised_amount,p.currency)} <small>de ${fmtMoney(p.goal_amount,p.currency)}</small></div><div class="pbar"><i style="width:${pc}%"></i></div><div class="pmeta">${pc}% de la meta alcanzada</div>`:'<div class="pmeta" style="margin-bottom:14px">Tu apoyo puede marcar la diferencia.</div>'}
        ${p.campaign_id
          ? `<a class="btn btn-gold" href="/campana?c=${encodeURIComponent(p.campaign_id)}">${esc(p.cta_label||'Donar ahora')}</a>`
          : p.cta_url
          ? `<a class="btn btn-gold" href="${esc(p.cta_url)}" target="_blank" rel="noopener">${esc(p.cta_label||'Ayudar ahora')}</a>`
          : `<a class="btn btn-gold" href="/donar">Donar a SISMO911</a>`}
        <div style="height:10px"></div>
        <button class="btn btn-red" data-act="__shareAuto">↗ Compartir su perfil</button>
        <div class="share-h">Difunde y salva vidas</div>
        <div class="shares">
          <a class="sh wa" data-act="shareTo" data-a1="whatsapp">${ICON.whatsapp}WhatsApp</a>
          <a class="sh x" data-act="shareTo" data-a1="x">${ICON.x}X</a>
          <a class="sh fb" data-act="shareTo" data-a1="facebook">${ICON.facebook}Facebook</a>
          <a class="sh tg" data-act="shareTo" data-a1="telegram">${ICON.telegram}Telegram</a>
        </div>
        <div style="height:8px"></div>
        <a class="sh" style="grid-column:span 4;flex-direction:row;gap:8px" data-act="shareTo" data-a1="copy">${ICON.copy}Copiar enlace</a>
        ${p.contact?`<div class="contact">📞 ${esc(p.contact)}</div>`:''}
      </div>
    </aside>
  </div>`;
}

async function load(){
  if(!slug){$('app').innerHTML='<div class="nf"><b>Perfil no encontrado</b>Vuelve a la lista de emergencias.</div>';return;}
  try{
    const r=await fetch('/api/emergencia/'+encodeURIComponent(slug),{headers:{'Accept':'application/json'}});
    if(!r.ok)throw 0;
    const j=await r.json();
    render(j.profile);
    document.title=`${j.profile.name} necesita ayuda urgente — SISMO911`;
  }catch(e){
    $('app').innerHTML='<div class="nf"><b>Perfil no encontrado</b>Es posible que ya no esté disponible. <a href="/emergencia" style="color:var(--blue)">Ver todas las emergencias →</a></div>';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
function __shareAuto(el){shareTo(navigator.share?'native':'copy');}
var ACTIONS={closeLb:closeLb,openLb:openLb,shareTo:shareTo,__shareAuto:__shareAuto};
function __resolveArgs(el){var a=[],i=1,v;while((v=el.getAttribute("data-a"+i))!==null){a.push(v==="@value"?el.value:(v==="@checked"?el.checked:v));i++;}a.push(el);return a;}
["click","change","input"].forEach(function(ev){document.addEventListener(ev,function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var want=el.getAttribute("data-ev")||"click";if(want!==ev)return;
  var f=ACTIONS[el.getAttribute("data-act")];if(f)f.apply(el,__resolveArgs(el));},false);});
load();
</script>
</body>
</html>
