<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi cuenta — SISMO911</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/logo.svg"><meta name="theme-color" content="#13284f">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css" />
<script src="/app-shell.js" defer></script>

<style>body{background:#f9f9fc}.font-display{font-family:'Public Sans',sans-serif}</style>
</head>
<body class="font-sans text-on-surface">

<main class="mx-auto max-w-3xl px-4 py-8" id="app">
  <p class="text-on-surface-variant">Cargando…</p>
</main>

<script>
const ROLE={citizen:['Ciudadano','bg-safe'],operator:['Operador','bg-warning'],admin:['Administrador','bg-secondary']};
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{if(!t)return '—';const s=(Date.now()-t)/1000;if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';};
document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login.html';};

(async()=>{
  const me=await fetch('/api/auth/me').then(r=>r.json());
  if(!me.authenticated){ location.href='/login.html?next=/cuenta.html'; return; }
  const u=me.user; const [rl,rc]=ROLE[u.role]||ROLE.citizen;
  const initials=esc((u.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase());
  let html=`
    <div class="bg-white border border-outline-variant/60 rounded-lg p-6 flex items-center gap-4 mb-6">
      <div class="h-16 w-16 rounded-full bg-primary text-white grid place-items-center font-display font-bold text-xl">${initials}</div>
      <div class="flex-1">
        <div class="font-display font-extrabold text-2xl">${u.rank?esc(u.rank)+' ':''}${esc(u.name)}</div>
        <div class="text-on-surface-variant text-sm">${esc(u.email)}${u.unit?' · '+esc(u.unit):''}</div>
      </div>
      <span class="${rc} text-white text-xs font-bold px-3 py-1 rounded-full">${rl}</span>
    </div>`;

  // Encrypted custodial wallet (Crossmint, Base). Provisioned at signup.
  const waddr=u.wallet_address;
  html+=`<div class="bg-white border border-outline-variant/60 rounded-lg p-5 mb-6">
    <div class="flex items-center justify-between gap-3 mb-1">
      <h2 class="font-display font-bold text-lg">Mi billetera cifrada</h2>
      <span class="text-xs bg-primary text-white px-2 py-0.5 rounded-full">Base · USDC</span></div>
    <p class="text-on-surface-variant text-sm mb-3">Billetera custodia cifrada (las llaves las resguarda Crossmint; nunca se almacenan en SISMO911). Úsala para recibir y enviar apoyo.</p>
    <div id="wallet">${waddr
      ? `<code class="block bg-surface-container rounded px-3 py-2 text-xs break-all">${esc(waddr)}</code>`
      : `<button id="mkwallet" class="bg-primary text-white text-sm font-bold rounded-lg px-4 py-2">Crear mi billetera</button><div id="werr" class="text-secondary text-xs mt-2"></div>`}</div>
    <a href="/donar" class="inline-block mt-3 text-sm text-primary hover:underline">→ Ver campañas para donar</a>
  </div>`;

  if(u.role==='operator'||u.role==='admin'){
    html+=`<a href="/admin" class="block bg-primary text-white rounded-lg p-5 mb-6 hover:bg-primary-container transition">
      <div class="font-display font-bold text-lg">→ Consola de Operaciones</div>
      <div class="text-white/70 text-sm">Personas desaparecidas, directorio, fuentes de datos, gestión.</div></a>`;
  }

  // citizen: their check-ins
  html+=`<h2 class="font-display font-bold text-lg mb-2">Mis registros de seguridad</h2><div id="mine" class="space-y-2 mb-6"></div>`;

  if(u.role==='admin'){
    html+=`<h2 class="font-display font-bold text-lg mb-2">Gestión de usuarios</h2>
      <div class="bg-white border border-outline-variant/60 rounded-lg overflow-hidden"><table class="w-full text-sm"><thead class="bg-[#eeeef0] text-left text-xs uppercase text-on-surface-variant font-display"><tr><th class="px-4 py-2">Nombre</th><th class="px-3">Correo</th><th class="px-3">Rol</th></tr></thead><tbody id="users"></tbody></table></div>`;
  }
  document.getElementById('app').innerHTML=html;

  // lazy wallet creation (users created before wallets existed, or failed at signup)
  const mk=document.getElementById('mkwallet');
  if(mk) mk.onclick=async()=>{
    mk.disabled=true; mk.textContent='Creando…';
    const r=await fetch('/api/auth/wallet',{method:'POST'}); const d=await r.json().catch(()=>({}));
    if(r.ok&&d.wallet){ document.getElementById('wallet').innerHTML=`<code class="block bg-surface-container rounded px-3 py-2 text-xs break-all">${esc(d.wallet.address)}</code>`; }
    else { document.getElementById('werr').textContent = d.error==='wallet_not_configured' ? 'Las billeteras se están habilitando. Vuelve pronto.' : 'No se pudo crear la billetera. Intenta más tarde.'; mk.disabled=false; mk.textContent='Crear mi billetera'; }
  };

  // my check-ins (match by name)
  const {checkins=[]}=await fetch('/api/checkins').then(r=>r.json());
  const mine=checkins.filter(c=>c.name===u.name);
  document.getElementById('mine').innerHTML=mine.length?mine.map(c=>`<div class="bg-white border border-outline-variant/60 rounded px-4 py-2 flex justify-between text-sm"><span>${c.status==='safe'?'✅ A salvo':'🆘 Necesita ayuda'} ${c.message?'· '+esc(c.message):''}</span><span class="text-on-surface-variant text-xs">hace ${ago(c.created_ms)}</span></div>`).join(''):'<p class="text-on-surface-variant text-sm">Aún no has registrado tu estado. <a href="/familia" class="text-primary underline">Hazlo aquí</a>.</p>';

  if(u.role==='admin'){
    const {users=[]}=await fetch('/api/auth/users').then(r=>r.json());
    document.getElementById('users').innerHTML=users.map(x=>`<tr class="border-t border-outline-variant/40"><td class="px-4 py-2">${esc(x.name)}</td><td class="px-3 text-xs">${esc(x.email)}</td>
      <td class="px-3"><select data-id="${esc(x.id)}" class="role-sel border border-outline-variant rounded px-2 py-1 text-xs">
        ${['citizen','operator','admin'].map(r=>`<option value="${r}" ${x.role===r?'selected':''}>${ROLE[r][0]}</option>`).join('')}</select></td></tr>`).join('');
    document.querySelectorAll('.role-sel').forEach(s=>s.onchange=async()=>{await fetch('/api/auth/users/'+s.dataset.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({role:s.value})});});
  }
})();
</script>
</body>
</html>
