<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Fuerza de Protección Civil SISMO911">
  <defs>
    <path id="arcTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
    <path id="arcBot" d="M 36 100 A 64 64 0 0 0 164 100" fill="none"/>
  </defs>

  <!-- Seal body -->
  <circle cx="100" cy="100" r="99" fill="#fff"/>
  <circle cx="100" cy="100" r="98" fill="#13284f"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="100" cy="100" r="62" fill="#13284f" stroke="#fff" stroke-width="1.5"/>

  <!-- Ring text -->
  <text fill="#fff" font-family="'Public Sans',Arial,sans-serif" font-weight="800" letter-spacing="0.8">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle" font-size="11">FUERZA DE PROTECCIÓN CIVIL</textPath>
  </text>
  <text fill="#fff" font-family="'Public Sans',Arial,sans-serif" font-weight="800" letter-spacing="3">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle" font-size="15">SISMO911</textPath>
  </text>
  <!-- Side stars separating the ring text -->
  <g fill="#fff">
    <path d="M30 100 l1.7 3.4 3.8.5-2.8 2.7.7 3.8-3.4-1.8-3.4 1.8.7-3.8-2.8-2.7 3.8-.5z"/>
    <path d="M170 100 l1.7 3.4 3.8.5-2.8 2.7.7 3.8-3.4-1.8-3.4 1.8.7-3.8-2.8-2.7 3.8-.5z"/>
  </g>

  <!-- Heraldic spread eagle -->
  <g>
    <!-- left wing -->
    <path d="M100 70 C 84 60 60 58 40 66 C 58 64 74 70 86 82 C 70 78 54 80 42 88 C 60 86 76 92 88 102 C 74 100 60 104 50 112 C 70 110 88 112 100 118 Z" fill="#fff"/>
    <!-- right wing (mirror) -->
    <path d="M100 70 C 116 60 140 58 160 66 C 142 64 126 70 114 82 C 130 78 146 80 158 88 C 140 86 124 92 112 102 C 126 100 140 104 150 112 C 130 110 112 112 100 118 Z" fill="#fff"/>
    <!-- red feather accents -->
    <path d="M100 73 C 88 66 72 64 58 68 C 72 68 84 73 92 82 Z" fill="#c8102e"/>
    <path d="M100 73 C 112 66 128 64 142 68 C 128 68 116 73 108 82 Z" fill="#c8102e"/>
    <path d="M100 86 C 90 81 78 80 68 83 C 80 83 90 88 96 95 Z" fill="#c8102e"/>
    <path d="M100 86 C 110 81 122 80 132 83 C 120 83 110 88 104 95 Z" fill="#c8102e"/>
    <!-- head + neck -->
    <path d="M100 52 c -6 0 -10 4 -10 9 c 0 4 2 6 5 8 l 0 6 10 0 0-6 c 3-2 5-4 5-8 c 0-5-4-9-10-9 z" fill="#fff"/>
    <path d="M90 60 l -8 -2 8 5 z" fill="#fff"/>
    <circle cx="96.5" cy="60" r="1.4" fill="#13284f"/>
    <!-- body/tail tapering to shield -->
    <path d="M92 78 L108 78 L106 120 L100 128 L94 120 Z" fill="#fff"/>
  </g>

  <!-- Quartered shield -->
  <g transform="translate(100,128)">
    <path d="M-15 -4 H15 V8 C15 18 8 24 0 28 C-8 24 -15 18 -15 8 Z" fill="#fff"/>
    <clipPath id="sh"><path d="M-14 -3 H14 V8 C14 17.5 7.5 23 0 27 C-7.5 23 -14 17.5 -14 8 Z"/></clipPath>
    <g clip-path="url(#sh)">
      <rect x="-14" y="-4" width="14" height="15.5" fill="#c8102e"/>
      <rect x="0" y="-4" width="14" height="15.5" fill="#13284f"/>
      <rect x="-14" y="11.5" width="14" height="20" fill="#13284f"/>
      <rect x="0" y="11.5" width="14" height="20" fill="#c8102e"/>
      <!-- quadrant motifs -->
      <g fill="#fff">
        <path d="M-9 8 q1-7 3-9 q-1 5 0 9 z"/>            <!-- wheat -->
        <path d="M6 1 l1 2 2 .2-1.4 1.4.4 2.2-2-1-2 1 .4-2.2-1.4-1.4 2-.2z"/>  <!-- star -->
        <rect x="-8.2" y="15" width="2.2" height="11"/>    <!-- cross v -->
        <rect x="-11" y="18" width="8" height="2.2"/>      <!-- cross h -->
      </g>
      <g stroke="#fff" stroke-width="1.4">
        <line x1="1" y1="26" x2="13" y2="14"/>
        <line x1="3" y1="28" x2="13" y2="19"/>
      </g>
    </g>
  </g>
</svg>
