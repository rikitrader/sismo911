name: Deploy (Cloudflare)
on:
  push:
    branches: [main]        # every merge to main re-asserts the full main → prevents stale-worktree overwrites
    tags: ['v*.*.*']
  workflow_dispatch:
# Least privilege for the auto GITHUB_TOKEN — the deploy never writes repo contents.
permissions:
  contents: read
# Serialize prod deploys so concurrent merges can't race; the newest main wins.
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations with dedicated least-privilege token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_D1_API_TOKEN GitHub secret is required for remote D1 migrations" >&2; exit 1; }
          npm run db:migrate:remote
      - name: Deploy Worker and containers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN GitHub secret is required for Worker deployment" >&2; exit 1; }
          npm run deploy
