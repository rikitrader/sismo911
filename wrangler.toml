name = "sismo911"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
# Disabled (security hardening): the bare *.workers.dev host is the ONE hostname
# Cloudflare Access can't gate, so it bypassed zone-level protections. The worker
# is served only via the sismo911.com routes below; admin/operator APIs are
# session-gated in-Worker regardless of host (verified). Flip back to true only
# if a workers.dev fallback URL is explicitly needed.
workers_dev = false

# Custom domains on the sismo911.com zone. The apex + www serve the app; Access
# (which can't gate a bare *.workers.dev host) attaches to these hostnames.
[[routes]]
pattern = "sismo911.com"
custom_domain = true

[[routes]]
pattern = "www.sismo911.com"
custom_domain = true

[[routes]]
pattern = "app.sismo911.com"
custom_domain = true

# SUMINISTROS division — inventory & supply-chain management. Same Worker; its
# root is rewritten to /suministros via a host-scoped rule in public/_redirects.
[[routes]]
pattern = "suministros.sismo911.com"
custom_domain = true

# Static frontend served by the Assets layer DIRECTLY (free, no Worker invocation)
# for the high-traffic static shells (homepage, /dashboard, /casos, /sos, ...).
# `run_worker_first` lists ONLY the DYNAMIC routes the Worker must own — every
# other path is served straight from ./public. The list also opts those paths out
# of the Sec-Fetch-Mode navigation heuristic, so dynamic HTML pages (which have no
# matching static file) reach the Worker instead of hitting not_found_handling.
# Anything here that needs the Worker: all /api, the MCP server, OG-rewritten
# /familia + /emergencia/:slug, the dynamic blog/estado/agencias/botiquin/plan
# pages, the generated sitemaps, and the auth-gated /admin* pages.
# (Homepage `/`→personas, `/terremotos`, `/la-guaira` are remapped in public/_redirects;
#  security headers for direct-served assets live in public/_headers.)
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = [
  # Root is Worker-owned so it can host-branch by hostname: the SUMINISTROS
  # subdomain root serves the inventory SPA, every other host serves the
  # DESAPARECIDOS registry (see app.get('/') in src/index.ts). The homepage
  # shell is still edge-cached (60s + SWR 300s) by serveAsset, so this does not
  # meaningfully increase Worker load on the high-traffic apex.
  "/",
  # SUMINISTROS SPA shell is Worker-owned so the gate can require suministros:read
  # (staff-only) before serving it — the division is not publicly open.
  "/suministros",
  # CITIZEN Suministros intake page is Worker-owned so the login gate runs BEFORE
  # the static asset is served (anon → /login, no page flash). The page also
  # self-redirects on the API 401, but this gives a clean server-side 302.
  "/suministros-ciudadano",
  "/api/*",
  "/mcp",
  "/console",
  "/console/",
  # Operator roster importer page is Worker-owned so the console-access gate runs
  # BEFORE the static asset is served (anon → /login, no public page flash).
  "/importar",
  "/flota/track",
  "/flota/track/*",
  "/ws/flota/*",
  "/familia",
  "/emergencia/*",
  "/estados",
  "/estado/*",
  "/agencias",
  "/agencias/*",
  "/botiquin",
  "/botiquin/*",
  "/blog",
  "/blog/*",
  "/sitemap-blog.xml",
  "/sitemap-desaparecidos.xml",
  "/sitemap-edificios.xml",
  "/plan",
  "/plan/*",
  "/admin",
  "/admin/*",
  "/admin-casos",
  "/admin-csp",
  "/admin-emergencia",
  "/admin-evidencias",
  # These admin shells were served by the edge (bypassing the Worker auth gate)
  # because they weren't worker-first — found in a security QA sweep. Worker-first
  # so evaluateGate() redirects unauthenticated visitors to /login (server-gated,
  # matching their siblings above) instead of serving the shell client-gated.
  "/admin-dup-review",
  "/admin-flota-live",
  "/admin-flota-unidades",
  "/admin-ninez",
  "/admin-x402",
  "/e/*",
]

# Run every ingest/sync job once per hour (one parse per hour).
[triggers]
# Staggered so each trigger is a SEPARATE invocation with its own subrequest
# budget (see src/cron.ts CRON_GROUPS — keep in sync; test/cron.test.ts checks it).
# HARD LIMIT: this account allows only 5 cron triggers (CF API error 10072 on a
# 6th — the Free-tier cap; Workers Paid would allow 250). So we MUST stay at 5 and
# speed the one-time photo-phash backfill by running it in MULTIPLE existing groups
# (:05/:30/:45), not by adding a new cron trigger.
crons = ["0 * * * *", "5 * * * *", "15 * * * *", "30 * * * *", "45 * * * *"]

# Relational store: events, missing persons, emergency contacts, citizen reports.
[[d1_databases]]
binding = "DB"
database_name = "sismo911"
database_id = "0b7aae58-b326-416d-b28b-632becb6981c"

# Hot cache for the latest normalized USGS GeoJSON + computed PAGER payloads.
[[kv_namespaces]]
binding = "CACHE"
id = "2d5be96112724b8dbfaae2723d3a4dd3"

# Damage-photo storage (uploaded images, keyed; served back via /api/damage/photo).
[[kv_namespaces]]
binding = "PHOTOS"
id = "dc4674529c1a4dd4b747d8e7e3398d17"


# Missing-person photos (browsable gallery).
[[r2_buckets]]
binding = "PERSON_PHOTOS"
bucket_name = "sismo911-person-photos"


# Missing-person photos. personas data is centralized in the `sismo911` DB above
# (single source of truth) — the former legacy `desaparecidos-vzla` D1 binding was
# removed because no code references env.DESAP. The R2 photo bucket stays: foto_r2
# keys are stored here and served via /api/familia/photo/:id.
[[r2_buckets]]
binding = "DESAP_FOTOS"
bucket_name = "desaparecidos-fotos"

# FLOTA live-tracking Durable Object — real-time unit positions on the command
# map (operator consoles subscribe via WebSocket; the GPS-ingest handler
# publishes). SQLite-backed class → free-tier compatible.
[[durable_objects.bindings]]
name = "FLOTA_TRACKING"
class_name = "FlotaTracking"

# Live-GPS hub: phone units stream GPS; operator consoles subscribe.
[[durable_objects.bindings]]
name = "FLEET_LIVE"
class_name = "FleetLive"

[[migrations]]
tag = "v1-flota-tracking"
new_sqlite_classes = ["FlotaTracking"]

[[migrations]]
tag = "v2-fleet-live"
new_sqlite_classes = ["FleetLive"]

[observability]
enabled = true

# Cloudflare Workers AI — free-tier inference for situation reports + damage triage.
[ai]
binding = "AI"

# Cloudflare Email Sending — native transactional email (no API keys).
# Requires onboarding sismo911.com: `wrangler email sending enable sismo911.com`
# (or Dashboard → Email → Email Sending). Until then, sends are no-ops (logged).
[[send_email]]
name = "EMAIL"

