name = "sismo911"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
# Keep the workers.dev URL alive alongside the app.sismo911.com custom domain.
# app.sismo911.com is the Access-protected canonical host; /admin is also gated
# on workers.dev by the in-Worker JWT check (run_worker_first).
workers_dev = true

# Custom domains on the sismo911.com zone. The apex + www serve the app; Access
# (which can't gate a bare *.workers.dev host) attaches to these hostnames.
[[routes]]
pattern = "sismo911.com"
custom_domain = true

[[routes]]
pattern = "www.sismo911.com"
custom_domain = true

[[routes]]
pattern = "app.sismo911.com"
custom_domain = true

# Static frontend (dashboard, PAGER, admin) served by the Worker.
# run_worker_first = true → the Worker (and the Access gate) runs before assets
# are served, so /admin is protected even on the workers.dev hostname.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Poll USGS every minute (Cloudflare cron minimum granularity).
[triggers]
crons = ["* * * * *"]

# Relational store: events, missing persons, emergency contacts, citizen reports.
[[d1_databases]]
binding = "DB"
database_name = "sismo911"
database_id = "0b7aae58-b326-416d-b28b-632becb6981c"

# Hot cache for the latest normalized USGS GeoJSON + computed PAGER payloads.
[[kv_namespaces]]
binding = "CACHE"
id = "2d5be96112724b8dbfaae2723d3a4dd3"

# Damage-photo storage (uploaded images, keyed; served back via /api/damage/photo).
[[kv_namespaces]]
binding = "PHOTOS"
id = "dc4674529c1a4dd4b747d8e7e3398d17"


# Missing-person photos (browsable gallery).
[[r2_buckets]]
binding = "PERSON_PHOTOS"
bucket_name = "sismo911-person-photos"


# Missing-persons dataset (31k records) + photos (separate resources).
[[d1_databases]]
binding = "DESAP"
database_name = "desaparecidos-vzla"
database_id = "b722baa9-00d8-4b66-82ca-fe495eef1851"

[[r2_buckets]]
binding = "DESAP_FOTOS"
bucket_name = "desaparecidos-fotos"

[observability]
enabled = true

# Cloudflare Workers AI — free-tier inference for situation reports + damage triage.
[ai]
binding = "AI"

[vars]
# Venezuela bounding box for the USGS FDSN query (min/max lat/lon).
USGS_MINLAT = "-2"
USGS_MAXLAT = "16"
USGS_MINLON = "-76"
USGS_MAXLON = "-58"
USGS_WINDOW_DAYS = "30"
# Cloudflare Access — set these after creating the Access application (the AUD
# tag from the app, and your team domain <team>.cloudflareaccess.com → just the
# <team> part). Empty = enforcement disabled (app stays open).
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Optional comma-separated preview origins for CORS. Leave empty in production
# unless a trusted deployment preview needs API access.
ALLOWED_ORIGINS = ""
# Web Push public key (safe to expose). Private key is a Worker secret (VAPID_PRIVATE_KEY).
VAPID_PUBLIC_KEY = "BLWuQ5I87NCxY_PJf9vplu423M7hDMbXgp98_no9mSZ54G5h4v_hYPcynxaNFWo0-HNyGTaMtQK1l-_g5g2qtL8"
