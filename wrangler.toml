name = "sismo911"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Static frontend (dashboard, PAGER, admin) served directly from the Worker.
# API routes (/api/*) are not files in ./public, so the Worker handles them.
[assets]
directory = "./public"
binding = "ASSETS"

# Poll USGS every minute (Cloudflare cron minimum granularity).
[triggers]
crons = ["* * * * *"]

# Relational store: events, missing persons, emergency contacts, citizen reports.
[[d1_databases]]
binding = "DB"
database_name = "sismo911"
database_id = "0b7aae58-b326-416d-b28b-632becb6981c"

# Hot cache for the latest normalized USGS GeoJSON + computed PAGER payloads.
[[kv_namespaces]]
binding = "CACHE"
id = "2d5be96112724b8dbfaae2723d3a4dd3"

[observability]
enabled = true

[vars]
# Venezuela bounding box for the USGS FDSN query (min/max lat/lon).
USGS_MINLAT = "-2"
USGS_MAXLAT = "16"
USGS_MINLON = "-76"
USGS_MAXLON = "-58"
USGS_WINDOW_DAYS = "30"
